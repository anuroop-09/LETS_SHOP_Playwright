name: Playwright Manual Trigger
on:
  workflow_dispatch:
jobs:
  run_all:
    runs-on: ubuntu-latest
    steps:
      - name: Get code from the repo
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install
      - name: Install Allure Report
        run: npm install allure-playwright
      - name: Run Playwright Test
        run: npm run suite
      - name: Run Allure Report
        run: npm run generate_report
      - name: Upload Report
        uses: actions/upload-artifact@v6
        with:
          path: allure-report 