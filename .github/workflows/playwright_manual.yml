name: Playwright Manual Trigger
on:
  workflow_dispatch:
jobs:
  run_all:
    runs-on: ubuntu-latest
    steps:
      - name: Get code from the repo
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: npm ci
      - name: Run Playwright Test
        run: npm run suite
      - name: Run Allure Report
        run: npm run generate_report
